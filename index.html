<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filum</title>
<link rel="icon" href="data:,">
<style>
  :root { --fond:#fafaf7; --texte:#1c1c1a; --doux:#6b6b66; --trace:#2b6cb0; --alerte:#d62828; --avert:#e08a00; --selection:#7b2cbf; --surligne:#efe3fb; --bon:#2f855a; --bord:#d9d9d2; }
  @media (prefers-color-scheme: dark) {
    :root { --fond:#16161a; --texte:#ececec; --doux:#9a9a9a; --trace:#63b3ed; --alerte:#ff6b6b; --avert:#f6ad55; --selection:#d0a3ff; --surligne:#3a2a4d; --bon:#68d391; --bord:#34343a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--fond); color:var(--texte); }
  main { max-width:1280px; margin:0 auto; padding:16px; }
  h1 { margin:0 0 4px; } .sous { color:var(--doux); margin:0 0 16px; }
  .ligne { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1; min-width:200px; padding:8px; font:inherit; border:1px solid var(--bord); border-radius:6px; background:transparent; color:inherit; }
  input[type=checkbox] { flex:none; min-width:0; width:auto; padding:0; margin:0 6px 0 0; border:0; vertical-align:middle; }
  .pastille-morceau { display:inline-block; width:12px; height:4px; border-radius:2px; vertical-align:middle; }
  .sw0 { background:#2b6cb0; } .sw1 { background:#0b8a8a; } .sw2 { background:#a0522d; } .sw3 { background:#6b7d1f; } .sw4 { background:#c2185b; } .sw5 { background:#455a64; }
  .tag-ajout { color:var(--bon); } .tag-modif { color:var(--avert); } .tag-retrait { color:var(--alerte); }
  table.contrib { border-collapse:collapse; font-size:.875rem; margin:6px 0; } table.contrib th, table.contrib td { padding:2px 10px; text-align:right; border-bottom:1px solid var(--bord); } table.contrib th:first-child, table.contrib td:first-child { text-align:left; }
  svg.osmc { vertical-align:middle; margin:0 4px; }
  button.morceau { font:inherit; background:none; border:1px solid var(--bord); border-radius:4px; padding:0 6px; cursor:pointer; color:inherit; }
  svg .voie.removed { stroke:var(--alerte); stroke-width:7; stroke-dasharray:8 5; }
  .feuille { position:relative; padding-right:14px; }
  .rail { position:absolute; left:2px; top:0; bottom:0; width:8px; border-left:2px solid var(--trace); pointer-events:none; }
  .rail-debut { top:50%; border-top:2px solid var(--trace); border-top-left-radius:8px; }
  .rail-fin { bottom:50%; border-bottom:2px solid var(--trace); border-bottom-left-radius:8px; }
  .rail-d { left:auto; right:2px; border-left:0; border-right:2px solid var(--trace); }
  .rail-d.rail-debut { border-top-left-radius:0; border-top-right-radius:8px; }
  .rail-d.rail-fin { border-bottom-left-radius:0; border-bottom-right-radius:8px; }
  .rail-seul { left:1px; top:50%; bottom:auto; width:8px; height:8px; margin-top:-4px; border:2px solid var(--trace); border-radius:50%; }
  label.mineurs { display:flex; align-items:flex-start; gap:6px; }
  label.mineurs input { margin:3px 0 0; }
  button.go { padding:8px 16px; font:inherit; border:0; border-radius:6px; background:var(--trace); color:#fff; cursor:pointer; }
  button.go:disabled { opacity:.5; }
  #status.erreur, .erreur { color:var(--alerte); } #status { min-height:1.5em; margin:8px 0; }
  #liste { margin:8px 0; max-height:calc(100vh - 380px); min-height:160px; overflow:auto; border:1px solid var(--bord); border-radius:6px; padding:4px 8px; }
  #liste details { margin-left:0; } #liste details.plie { margin:2px 0; } #liste details.plie > summary { cursor:pointer; } #liste .enfants { margin-left:18px; border-left:1px solid var(--bord); padding-left:8px; }
  details.preuve { margin:2px 0 4px 12px; font-size:12px; } details.preuve > summary { cursor:pointer; color:var(--doux); }
  details.preuve > div { padding:4px 0 2px 10px; border-left:2px solid var(--bord); line-height:1.6; }
  #stats .stats { padding:4px 0 4px 10px; border-left:2px solid var(--bord); line-height:1.6; } #stats summary { cursor:pointer; }
  .pistes { margin:2px 0 4px 16px; font-size:13px; } .pistes ul { margin:2px 0; padding-left:18px; }
  circle.contenu { fill:#2f855a; fill-opacity:.8; stroke:none; } #contenu-res .groupes { margin-top:4px; }
  #liste summary { cursor:pointer; padding:3px 0; } .feuille { padding:2px 0 2px 14px; font-size:.9rem; }
  .detail { color:var(--doux); font-size:.8125rem; } .role { background:var(--bord); border-radius:4px; padding:0 6px; margin-left:6px; font-size:.75rem; }
  .pastille { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; background:var(--bord); }
  .pastille.bon { background:var(--bon); } .pastille.mauvais { background:var(--alerte); } .pastille.ordre { background:var(--avert); } .pastille.vide { background:transparent; }
  button.voir { font:inherit; font-size:.75rem; margin-left:6px; border:1px solid var(--bord); border-radius:4px; background:transparent; color:inherit; cursor:pointer; }
  a { color:var(--trace); }
  .el { cursor:pointer; border-bottom:1px dotted var(--doux); } #enquete li.selection { background:var(--surligne); border-radius:4px; } .el.selection { font-weight:600; color:var(--selection); }
  .frise-pistes { position:relative; height:34px; margin:12px 0 2px; }
  #frise-fond { position:absolute; left:8px; right:8px; top:12px; height:10px; background:var(--bord); border-radius:5px; overflow:hidden; }
  #frise-fond .repere { position:absolute; top:0; width:1px; height:100%; background:var(--doux); opacity:.5; }
  #frise-fond .hors { position:absolute; top:0; height:100%; background:var(--fond); opacity:.72; pointer-events:none; }
  #frise-fond .bande { position:absolute; top:0; height:100%; background:var(--alerte); opacity:.85; }
  #frise-fond .bande.ordre { background:var(--avert); opacity:.7; height:40%; top:60%; }
  #frise-fond .bande.incertaine { background:repeating-linear-gradient(45deg, var(--alerte) 0 4px, transparent 4px 8px); }
  .frise-bulle { position:absolute; top:36px; z-index:5; max-width:340px; padding:6px 8px; font-size:12px; line-height:1.4; background:var(--fond); color:var(--texte,inherit); border:1px solid var(--bord); border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,.18); pointer-events:none; }
  .frise-bulle .rupture { color:var(--alerte); }
  .frise-pistes input[type=range] { position:absolute; left:0; top:0; width:100%; height:34px; margin:0; background:transparent; pointer-events:none; -webkit-appearance:none; appearance:none; }
  .frise-pistes input[type=range]::-webkit-slider-runnable-track { background:transparent; height:34px; }
  .frise-pistes input[type=range]::-moz-range-track { background:transparent; height:34px; }
  .frise-pistes input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; pointer-events:auto; width:14px; height:28px; margin-top:3px; border-radius:4px; background:var(--trace); border:2px solid var(--fond); cursor:ew-resize; }
  .frise-pistes input[type=range]::-moz-range-thumb { pointer-events:auto; width:10px; height:24px; border-radius:4px; background:var(--trace); border:2px solid var(--fond); cursor:ew-resize; }
  .frise-pistes input[type=range]:focus-visible::-webkit-slider-thumb { outline:2px solid var(--selection); }
  .frise-dates { display:flex; justify-content:space-between; font-size:.875rem; } .actions { margin:8px 0; }
  #frise-zone { margin:4px 0 8px; } .aide { color:var(--selection); font-size:.875rem; min-height:1.2em; }
  .evenements { margin:2px 0 4px 16px; font-size:.8125rem; } .ev { padding-left:8px; border-left:3px solid var(--bord); }
  .ev-created { border-left-color:var(--bon); } .ev-modified { border-left-color:var(--avert); }
  .ev-deleted, .ev-removed-from-relation { border-left-color:var(--alerte); } .ev-added-to-relation { border-left-color:var(--trace); }
  svg .voie.created { stroke:var(--bon); } svg .voie.modified { stroke:var(--avert); } svg .voie.added-to-relation { stroke:var(--trace); }
  svg .trait-trou.sel { stroke:var(--selection); stroke-width:3; }
  svg .voie.p0 { stroke:#2b6cb0; } svg .voie.p1 { stroke:#0b8a8a; } svg .voie.p2 { stroke:#a0522d; } svg .voie.p3 { stroke:#6b7d1f; } svg .voie.p4 { stroke:#c2185b; } svg .voie.p5 { stroke:#455a64; }
  svg .voie.sel { stroke:var(--selection); }
  .charge { margin:6px 0; } .charge progress { width:140px; vertical-align:middle; }
  .note { display:block; margin:2px 0 2px 16px; padding:2px 8px; border-left:3px solid var(--avert); background:var(--surligne); font-size:.8125rem; border-radius:0 4px 4px 0; }
  .discussion blockquote { margin:4px 0 4px 8px; padding:2px 8px; border-left:3px solid var(--bord); font-size:.875rem; }
  .feuille[data-sel] { cursor:pointer; } .feuille.selection { background:var(--surligne); outline:2px solid var(--selection); border-radius:4px; }
  svg .voie.sel { stroke:var(--selection); stroke-width:5; } svg .touche { cursor:pointer; }
  svg circle { cursor:pointer; } svg circle.sel { fill:var(--selection); }
  .duo { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:start; }
  .droite { position:sticky; top:8px; }
  #carte { position:relative; height:calc(100vh - 210px); min-height:320px; }
  #carte > p { color:var(--doux); }
  @media (max-width: 900px) { .duo { grid-template-columns:minmax(0,1fr); } .droite { position:static; } #carte { height:70vh; } }
  #carte svg { width:100%; height:100%; border:1px solid var(--bord); border-radius:6px; touch-action:none; cursor:grab; }
  #carte svg.glisse { cursor:grabbing; }
  #enquete { margin:16px 0; } .periode { border-left:4px solid var(--alerte); padding:0 12px; margin:12px 0; } .limite { color:var(--doux); font-size:.875rem; }
  .zoom { position:absolute; top:8px; right:8px; display:flex; flex-direction:column; gap:4px; }
  svg .noeud-membre { fill:#b7791f; stroke:#fff; stroke-width:1; vector-effect:non-scaling-stroke; cursor:pointer; } svg .noeud-membre.sel { fill:var(--selection); } svg.cache-noeuds .noeud-membre { display:none; }
  .pastille.noeud { background:#b7791f; border-radius:2px; transform:scale(.8); }
  .zoom button.actif { background:var(--trace); color:var(--fond); }
  .attrib { position:absolute; left:6px; bottom:4px; font-size:11px; padding:1px 5px; background:rgba(255,255,255,.8); color:#333; border-radius:3px; } .attrib a { color:#2b6cb0; }
  .zoom button { width:34px; height:34px; border:1px solid var(--bord); border-radius:6px; background:var(--fond); color:var(--texte); font:inherit; font-size:18px; cursor:pointer; }
</style>
<!-- Compteur de visites, sans cookie ni donnée personnelle : la seule chose qui quitte l'onglet
     en dehors des appels à l'API OpenStreetMap et aux tuiles du fond de carte. -->
<script data-goatcounter="https://filum.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<main>
  <h1>Filum</h1>
  <p class="sous">Détecte les discontinuités d'une relation OpenStreetMap.</p>
  <div class="ligne">
    <input id="relation" type="text" placeholder="Numéro ou adresse de relation (ex. 7444, r12586521, openstreetmap.org/relation/…)" aria-label="Numéro ou adresse de la relation">
    <button id="go" class="go">Analyser</button>
  </div>
  <div id="status" role="status"></div>
  <div id="frise-zone"></div>
  <div class="duo">
    <div class="gauche">
      <div id="supprimee"></div>
      <p id="resume"></p>
      <p id="parents" class="detail"></p>
      <p id="trous" class="detail"></p>
      <div id="stats" class="detail"></div>
      <div id="liste"></div>
      <section id="enquete"></section>
    </div>
    <div class="droite"><div id="carte"></div></div>
  </div>
</main>
<script src="src/continuity.js"></script>
<script src="src/html.js"></script>
<script src="src/osmc.js"></script>
<script src="src/liens.js"></script>
<script src="src/input.js"></script>
<script src="src/osmapi.js"></script>
<script src="src/viewport.js"></script>
<script src="src/tuiles.js"></script>
<script src="src/stats.js"></script>
<script src="src/repair.js"></script>
<script src="src/contenu.js"></script>
<script src="src/forensic.js"></script>
<script src="src/frise.js"></script>
<script src="src/changes.js"></script>
<script src="src/rings.js"></script>
<script src="src/tree.js"></script>
<script src="src/ui-base.js"></script>
<script src="src/ui-liste.js"></script>
<script src="src/ui-carte.js"></script>
<script src="src/ui-selection.js"></script>
<script src="src/ui-enquete.js"></script>
<script src="src/ui-contenu.js"></script>
<script src="src/app.js"></script>
</body>
</html>
